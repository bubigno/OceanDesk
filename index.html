<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DayCounter">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>Day Counter Dashboard</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --text-secondary: #8e8e93;
      --accent: #007aff;
      --accent-light: #e5f2ff;
      --border: #e5e5ea;
      --danger: #ff3b30;
      --positive: #34c759;
      --warning: #ff9500;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #ffffff;
        --text-secondary: #8e8e93;
        --accent: #0a84ff;
        --accent-light: rgba(10,132,255,0.15);
        --border: #38383a;
        --shadow: 0 2px 12px rgba(0,0,0,0.3);
        --danger: #ff453a;
        --positive: #30d158;
        --warning: #ff9f0a;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    /* Navigation */
    .nav-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .nav-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.2s;
      font-family: inherit;
    }

    .nav-btn.active {
      background: var(--accent);
      color: white;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-row label {
      font-size: 15px;
      font-weight: 500;
      min-width: 40px;
      color: var(--text-secondary);
    }

    input[type="date"], input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      -webkit-appearance: none;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: transform 0.15s, opacity 0.15s;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.98); opacity: 0.9; }

    .btn-secondary {
      background: var(--positive);
      margin-top: 10px;
    }

    .btn-danger {
      background: var(--danger);
      padding: 8px 14px;
      font-size: 13px;
      width: auto;
      margin-top: 0;
    }

    .total-box {
      text-align: center;
      padding: 24px 20px;
    }

    .total-number {
      font-size: 52px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -1px;
    }

    .total-label {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .year-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .year-item {
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 10px;
      transition: transform 0.15s;
    }

    .year-item:active { transform: scale(0.98); }

    .year-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .year-name {
      font-size: 15px;
      font-weight: 600;
    }

    .year-days {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .year-bar-bg {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .year-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Saved periods list */
    .period-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      transition: transform 0.15s;
    }

    .period-item:active { transform: scale(0.98); }

    .period-info {
      flex: 1;
    }

    .period-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .period-dates {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .period-days {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-right: 12px;
    }

    .period-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .icon-btn:hover { background: var(--border); color: var(--danger); }

    .grand-total {
      background: linear-gradient(135deg, var(--accent), #5856d6);
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    .grand-total .total-number {
      color: white;
      font-size: 56px;
    }

    .grand-total .total-label {
      color: rgba(255,255,255,0.8);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      opacity: 0.35;
    }

    .hidden { display: none !important; }

    .fade-in {
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    .badge-leap {
      background: color-mix(in srgb, var(--warning) 15%, transparent);
      color: var(--warning);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: var(--card);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navigation -->
    <div class="nav-bar">
      <button class="nav-btn active" onclick="showPage('calculator')" id="nav-calc">Calcola</button>
      <button class="nav-btn" onclick="showPage('dashboard')" id="nav-dash">Dashboard</button>
    </div>

    <!-- ===== CALCULATOR PAGE ===== -->
    <div id="page-calculator">
      <h1>📅 Conta Giorni</h1>

      <div class="card">
        <div class="card-title">Seleziona il periodo</div>
        <div class="input-group">
          <div class="input-row">
            <label>Da</label>
            <input type="date" id="startDate">
          </div>
          <div class="input-row">
            <label>A</label>
            <input type="date" id="endDate">
          </div>
          <div class="input-row">
            <label style="min-width:40px">Nome</label>
            <input type="text" id="periodName" placeholder="Es. Progetto Alpha, Vacanza...">
          </div>
          <button class="btn" onclick="calculate()">Calcola</button>
        </div>
      </div>

      <div id="calcResults" class="hidden">
        <div class="card total-box">
          <div class="total-number" id="totalDays">0</div>
          <div class="total-label">giorni totali</div>
        </div>

        <div class="card">
          <div class="card-title">Ripartizione per anno</div>
          <div id="yearList" class="year-list"></div>
        </div>

        <button class="btn btn-secondary" onclick="saveCurrentPeriod()">
          💾 Salva questo periodo
        </button>
      </div>

      <div id="calcEmpty" class="card empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <p>Seleziona un periodo e premi "Calcola"</p>
      </div>
    </div>

    <!-- ===== DASHBOARD PAGE ===== -->
    <div id="page-dashboard" class="hidden">
      <h1>📊 Dashboard</h1>

      <div class="card grand-total">
        <div class="total-number" id="grandTotalDays">0</div>
        <div class="total-label">giorni totali salvati</div>
      </div>

      <div class="card">
        <div class="section-title">Periodi salvati</div>
        <div id="savedPeriodsList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <p>Nessun periodo salvato</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Ripartizione annuale globale</div>
        <div id="globalYearList" class="year-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== STATE =====
    let currentCalculation = null;
    const STORAGE_KEY = 'daycounter_periods';

    // ===== UTILS =====
    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    function formatDateIT(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ===== NAVIGATION =====
    function showPage(page) {
      document.getElementById('page-calculator').classList.add('hidden');
      document.getElementById('page-dashboard').classList.add('hidden');
      document.getElementById('nav-calc').classList.remove('active');
      document.getElementById('nav-dash').classList.remove('active');

      document.getElementById('page-' + page).classList.remove('hidden');
      document.getElementById('nav-' + (page === 'calculator' ? 'calc' : 'dash')).classList.add('active');

      if (page === 'dashboard') {
        renderDashboard();
      }
    }

    // ===== CALCULATION =====
    function getDaysInRange(startStr, endStr) {
      const start = new Date(startStr + 'T00:00:00');
      const end = new Date(endStr + 'T00:00:00');

      if (end < start) {
        return { error: "La data di fine deve essere successiva alla data di inizio" };
      }

      const result = [];
      let totalDays = 0;
      const startYear = start.getFullYear();
      const endYear = end.getFullYear();

      for (let year = startYear; year <= endYear; year++) {
        let yearStart, yearEnd;

        if (year === startYear && year === endYear) {
          yearStart = new Date(start);
          yearEnd = new Date(end);
        } else if (year === startYear) {
          yearStart = new Date(start);
          yearEnd = new Date(year, 11, 31);
        } else if (year === endYear) {
          yearStart = new Date(year, 0, 1);
          yearEnd = new Date(end);
        } else {
          yearStart = new Date(year, 0, 1);
          yearEnd = new Date(year, 11, 31);
        }

        const days = Math.floor((yearEnd - yearStart) / 86400000) + 1;

        result.push({ year: year, days: days, isLeap: isLeapYear(year) });
        totalDays += days;
      }

      const maxDays = Math.max(...result.map(r => r.days));
      result.forEach(r => { r.percentage = (r.days / maxDays) * 100; });

      return { years: result, total: totalDays };
    }

    function calculate() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      if (!start || !end) {
        showToast("Seleziona entrambe le date");
        return;
      }

      const data = getDaysInRange(start, end);

      if (data.error) {
        showToast(data.error);
        return;
      }

      currentCalculation = {
        id: Date.now(),
        name: document.getElementById('periodName').value.trim() || ('Periodo ' + new Date().toLocaleDateString('it-IT')),
        start: start,
        end: end,
        total: data.total,
        years: data.years
      };

      document.getElementById('calcEmpty').classList.add('hidden');
      const results = document.getElementById('calcResults');
      results.classList.remove('hidden');
      results.classList.remove('fade-in');
      void results.offsetWidth;
      results.classList.add('fade-in');

      animateNumber(document.getElementById('totalDays'), data.total);

      const list = document.getElementById('yearList');
      list.innerHTML = '';

      data.years.forEach((y, i) => {
        const item = document.createElement('div');
        item.className = 'year-item';
        item.innerHTML = `
          <div class="year-header">
            <span class="year-name">${y.year}${y.isLeap ? '<span class="badge badge-leap">bisestile</span>' : ''}</span>
            <span class="year-days">${y.days}</span>
          </div>
          <div class="year-bar-bg">
            <div class="year-bar-fill" style="width:0%" data-width="${y.percentage.toFixed(1)}%"></div>
          </div>
        `;
        list.appendChild(item);
      });

      setTimeout(() => {
        document.querySelectorAll('#yearList .year-bar-fill').forEach(bar => {
          bar.style.width = bar.dataset.width;
        });
      }, 50);
    }

    function animateNumber(el, target) {
      const duration = 700;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(target * ease);
        el.textContent = current.toLocaleString('it-IT');

        if (progress < 1) requestAnimationFrame(update);
      }

      requestAnimationFrame(update);
    }

    // ===== STORAGE =====
    function getSavedPeriods() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function savePeriods(periods) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(periods));
    }

    function saveCurrentPeriod() {
      if (!currentCalculation) return;

      const periods = getSavedPeriods();
      periods.push(currentCalculation);
      savePeriods(periods);

      showToast('Periodo salvato!');
      document.getElementById('periodName').value = '';

      // Reset calc view
      document.getElementById('calcResults').classList.add('hidden');
      document.getElementById('calcEmpty').classList.remove('hidden');
      currentCalculation = null;
    }

    function deletePeriod(id) {
      if (!confirm('Eliminare questo periodo?')) return;
      const periods = getSavedPeriods().filter(p => p.id !== id);
      savePeriods(periods);
      renderDashboard();
      showToast('Periodo eliminato');
    }

    // ===== DASHBOARD =====
    function renderDashboard() {
      const periods = getSavedPeriods();
      const listEl = document.getElementById('savedPeriodsList');

      // Grand total
      const grandTotal = periods.reduce((sum, p) => sum + p.total, 0);
      animateNumber(document.getElementById('grandTotalDays'), grandTotal);

      // Periods list
      if (periods.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <p>Nessun periodo salvato</p>
          </div>
        `;
      } else {
        listEl.innerHTML = '';
        periods.slice().reverse().forEach(p => {
          const div = document.createElement('div');
          div.className = 'period-item';
          div.innerHTML = `
            <div class="period-info">
              <div class="period-name">${escapeHtml(p.name)}</div>
              <div class="period-dates">${formatDateIT(p.start)} → ${formatDateIT(p.end)}</div>
            </div>
            <div class="period-days">${p.total}</div>
            <div class="period-actions">
              <button class="icon-btn" onclick="deletePeriod(${p.id})" title="Elimina">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          `;
          listEl.appendChild(div);
        });
      }

      // Global year breakdown
      const yearTotals = {};
      periods.forEach(p => {
        p.years.forEach(y => {
          yearTotals[y.year] = (yearTotals[y.year] || 0) + y.days;
        });
      });

      const globalList = document.getElementById('globalYearList');
      const years = Object.keys(yearTotals).map(Number).sort((a, b) => a - b);

      if (years.length === 0) {
        globalList.innerHTML = '<div class="empty-state" style="padding:20px"><p style="font-size:14px">Nessun dato disponibile</p></div>';
      } else {
        globalList.innerHTML = '';
        const maxY = Math.max(...years.map(y => yearTotals[y]));
        years.forEach(y => {
          const days = yearTotals[y];
          const pct = (days / maxY) * 100;
          const div = document.createElement('div');
          div.className = 'year-item';
          div.innerHTML = `
            <div class="year-header">
              <span class="year-name">${y}${isLeapYear(y) ? '<span class="badge badge-leap">bisestile</span>' : ''}</span>
              <span class="year-days">${days}</span>
            </div>
            <div class="year-bar-bg">
              <div class="year-bar-fill" style="width:0%" data-width="${pct.toFixed(1)}%"></div>
            </div>
          `;
          globalList.appendChild(div);
        });

        setTimeout(() => {
          document.querySelectorAll('#globalYearList .year-bar-fill').forEach(bar => {
            bar.style.width = bar.dataset.width;
          });
        }, 50);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== INIT =====
    document.getElementById('endDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = '2023-01-01';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
