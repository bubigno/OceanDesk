<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulizia DayCounter</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}
button{padding:16px 32px;font-size:18px;border:none;border-radius:12px;background:#38bdf8;color:#0f172a;font-weight:700;cursor:pointer;margin:10px}
button:disabled{opacity:0.5;cursor:not-allowed}
#log{margin-top:20px;font-size:14px;color:#94a3b8;max-width:400px}
</style>
</head>
<body>
<h1>DayCounter - Pulizia</h1>
<p>Tocca il pulsante per cancellare la cache e reinstallare la PWA.</p>
<button onclick="clearAll()">Pulisci tutto</button>
<button onclick="goToApp()" id="goBtn" disabled>Vai alla PWA</button>
<div id="log"></div>
<script>
function log(msg){document.getElementById('log').innerHTML+='<p>'+msg+'</p>';}
function clearAll(){
  log('Cancellazione in corso...');
  localStorage.clear();
  sessionStorage.clear();
  if('caches' in window){
    caches.keys().then(function(names){
      return Promise.all(names.map(function(n){log('Cache: '+n);return caches.delete(n);}));
    }).then(function(){
      log('Cache cancellata.');
      if('serviceWorker' in navigator){
        return navigator.serviceWorker.getRegistrations();
      }
      return [];
    }).then(function(regs){
      return Promise.all(regs.map(function(r){log('SW: '+r.scope);return r.unregister();}));
    }).then(function(){
      log('Service Worker cancellato.');
      document.getElementById('goBtn').disabled=false;
      log('Pronto! Tocca "Vai alla PWA".');
    }).catch(function(e){log('Errore: '+e);});
  } else {
    document.getElementById('goBtn').disabled=false;
  }
}
function goToApp(){window.location.href='./index.html';}
</script>
</body>
</html>
